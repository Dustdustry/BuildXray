category.build-xray.name = 建造透视
keybind.build-xray.peek.name = 指针透视（按住）

setting.build-xray.transparent.name = 透视遮罩的透明度
setting.build-xray.mouse-mask-radius.name = 鼠标位置的透视半径

setting.build-xray.fade-in.name = 淡入时长
setting.build-xray.fade-in.description = 开始建造或规划后，透视效果淡入到完全显现所需的时间。
setting.build-xray.fade-out.name = 淡出时长
setting.build-xray.fade-out.description = 停止操作后透视效果淡出所需的时间，范围遮罩也会保留这么久。

setting.tile = {0} 格

build-xray.description.0 = 建造或者规划的时候，透视效果可以让你看到被遮挡的方块和单位。
build-xray.description.1 = \n[red]:warning:[]：透视效果可能会影响原版游戏的渲染，如果某些效果无法正常显示，请关闭此mod。\n
build-xray.description.2 = [sky]:infoCircle:[] v1.2：
build-xray.description.3 = 增加了淡入淡出效果，可在设置里调整淡出淡入的时间。
build-xray.description.4 = 透视效果会透视等离子钻机的光束了。
build-xray.description.5 = [sky]:infoCircle:[] v1.3：
build-xray.description.6 = 透明化单位阴影与墙体阴影。
build-xray.description.7 = 新增指针透视按键（默认 Alt），按住时只透视指针周围，键位可在设置里修改。