category.build-xray.name = Build X-Ray
keybind.build-xray.peek.name = Cursor X-Ray (Hold)

setting.build-xray.transparent.name = Mask Transparent
setting.build-xray.mask-soft.name = Mask Edge Softness
setting.build-xray.mask-soft.description = How soft the mask edge is. Higher values widen the transition into the area that is not x-rayed
setting.build-xray.mouse-mask-radius.name = Mouse Mask Radius
setting.build-xray.rect-expand.name = Rect Gradient Band Width

setting.build-xray.fade-in.name = Fade In Time
setting.build-xray.fade-in.description = How long the x-ray takes to fade in after you start building or planning
setting.build-xray.fade-out.name = Fade Out Time
setting.build-xray.fade-out.description = How long the x-ray takes to fade out after you stop. The selection mask is kept visible for this long

setting.build-xray.ground-units.name = X-Ray Ground & Naval Units
setting.build-xray.plans.name = X-Ray While Planning
setting.build-xray.plans.description = Make the area covered by build plans transparent
setting.build-xray.logic.name = X-Ray While Configuring Logic

setting.tile = {0} Tiles

build-xray.description.0 = While building or planning, the x-ray lets you see the blocks and units behind the ones in front.
build-xray.description.1 = \n[red]:warning:[]: The x-ray may affect vanilla rendering. If some effects fail to display correctly, please disable this mod.\n

build-xray.description.2 = [sky]:infoCircle:[] v1.2:
build-xray.description.3 = Added fade in and fade out; both times can be adjusted in the settings.
build-xray.description.4 = The x-ray now also makes the plasma bore's beam transparent.\n

build-xray.description.5 = [sky]:infoCircle:[] v1.3:
build-xray.description.6 = Unit shadows and wall shadows are now made transparent as well.
build-xray.description.7 = Added a cursor x-ray keybind (Alt by default). Hold it to x-ray only around the pointer; it can be rebound in the settings.\n

build-xray.description.8 = [sky]:infoCircle:[] v1.4:
build-xray.description.9 = The area covered by build plans is now made transparent as well.\n

build-xray.description.10 = [sky]:infoCircle:[] v1.5:
build-xray.description.11 = New mask implementation, with lower overhead.
build-xray.description.12 = Added "Mask Edge Softness" and "Rect Gradient Band Width" settings.
build-xray.description.13 = Added x-ray for ground and naval units, and around a logic block while configuring it.
build-xray.description.14 = The cursor mask value is now a radius instead of a diameter.\n
